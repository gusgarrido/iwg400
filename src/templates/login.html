{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>

<body>
    <main class="login-shell">
        <section class="login-card">
            <div class="brand">
                <span class="brand-dot"></span>
                RestAlert
            </div>

            <h1>Iniciar sesión</h1>

            <form id="form-login" method="post" action="/login/" novalidate>
                {% csrf_token %}

                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input id="email" name="email" type="email" placeholder="Ingresa tu correo electrónico" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" id="btn-login" disabled>Ingresar</button>
            </form>
        </section>
    </main>

    <script>
        (function () {
            const form = document.getElementById('form-login');
            const btn = document.getElementById('btn-login');
            const fields = ['email', 'password'].map(id => document.getElementById(id));

            function validate() {
                const ok = fields.every(c => c.value.trim() !== '');
                btn.disabled = !ok;
                btn.classList.toggle('active', ok);
            }
            fields.forEach(c => { c.addEventListener('input', validate); c.addEventListener('change', validate); });
            validate();

            form.addEventListener('submit', function (e) {
                if (btn.disabled) e.preventDefault();
            });
        }())
    </script>

</body>

</html>
